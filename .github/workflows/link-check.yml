name: Link Check

# Same rationale as easyorder: no package manager, no lockfile, so a
# broken-link/HTML sanity pass is the applicable free check for a static
# site rather than a dependency scanner.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # Newer lychee (shipped by lychee-action v2) dropped `--exclude-mail`;
          # mailto: links are excluded by default now, so the flag is both
          # invalid (it aborted the run with exit 2 before checking anything)
          # and unnecessary. The site has no mailto links regardless.
          args: --no-progress './**/*.html'
          fail: true
